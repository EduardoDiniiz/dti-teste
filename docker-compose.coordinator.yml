name: slp-coordinator-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slp
      POSTGRES_USER: slp
      POSTGRES_PASSWORD: slp
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - coordinator-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slp -d slp"]
      interval: 3s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka-native:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:59093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:59093:9094"
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://postgres:5432/slp
      DATASOURCES_DEFAULT_USERNAME: slp
      DATASOURCES_DEFAULT_PASSWORD: slp
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MICRONAUT_SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
volumes:
  coordinator-postgres:
