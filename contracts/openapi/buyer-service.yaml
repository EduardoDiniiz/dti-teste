openapi: 3.0.3
info:
  title: PiggiesBuyerService
  version: 1.0.0
  description: Ponto de entrada para ofertas de compra de 1 Piggy. Assíncrono (202 + consulta de status).
paths:
  /buy-offers:
    post:
      summary: Cria oferta de compra
      operationId: createBuyOffer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBuyOfferRequest' }
      responses:
        '202':
          description: Oferta aceita; o match acontece de forma assíncrona
          headers:
            Location:
              schema: { type: string, example: /buy-offers/3f2c6a1e-8b0a-4c5e-9a57-1d2b3c4d5e6f }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuyOffer' }
        '400': { $ref: '#/components/responses/Problem' }
  /buy-offers/{offerId}:
    get:
      summary: Consulta oferta de compra e seu status
      operationId: getBuyOffer
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Oferta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuyOffer' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Repetir a mesma chave devolve a mesma oferta, sem criar outra
      schema: { type: string, maxLength: 100 }
  schemas:
    CreateBuyOfferRequest:
      type: object
      required: [buyerId, price]
      properties:
        buyerId: { type: string, format: uuid }
        price:
          type: number
          description: USD que o comprador paga por 1 Piggy (até 2 casas)
          exclusiveMinimum: true
          minimum: 0
          multipleOf: 0.01
          example: 30.00
    BuyOffer:
      type: object
      required: [offerId, buyerId, price, status, createdAt]
      properties:
        offerId: { type: string, format: uuid }
        buyerId: { type: string, format: uuid }
        price: { type: number, example: 30.00 }
        status: { type: string, enum: [OPEN, EXECUTED] }
        tradeId: { type: string, format: uuid, nullable: true }
        executedPrice: { type: number, nullable: true, example: 25.00 }
        createdAt: { type: string, format: date-time }
        executedAt: { type: string, format: date-time, nullable: true }
  responses:
    Problem:
      description: Erro no formato RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
